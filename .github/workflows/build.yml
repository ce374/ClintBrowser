name: Build Clint Browser

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper JAR
        id: cache-wrapper-jar
        uses: actions/cache@v5
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-jar-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Provision Gradle Wrapper JAR
        if: steps.cache-wrapper-jar.outputs.cache-hit != 'true'
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          curl -fL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist
          "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Provision signing config
        env:
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          LOCAL_PROPS: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Using repository signing secret."
            printf '%s' "$SIGNING_KEY" | tr -d '\n' | base64 -d > app/release_keystore.jks
            printf '%s\n' "$LOCAL_PROPS" > local.properties
          else
            echo "No signing secret found — generating a fresh CI keystore so the release APK is signed and installable."
            keytool -genkeypair -v \
              -keystore app/release_keystore.jks \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias clint-ci \
              -storepass clintci -keypass clintci \
              -dname "CN=Clint CI, OU=Build, O=ClintBrowser, L=NA, ST=NA, C=NA"
            cat > local.properties <<'EOF'
          signingConfig.storeFile=app/release_keystore.jks
          signingConfig.storePassword=clintci
          signingConfig.keyAlias=clint-ci
          signingConfig.keyPassword=clintci
          EOF
            # Remove leading whitespace introduced by the heredoc indentation.
            sed -i 's/^[[:space:]]*//' local.properties
          fi

      - name: Build GitHub Release APKs
        run: ./gradlew assembleGithubRelease

      - name: List generated APKs
        run: find app/build/outputs/apk/github/release -name "*.apk" -exec ls -lh {} \;

      - name: Detect ABI split mode
        id: mode
        run: |
          if ls app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk 2>/dev/null; then
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Universal APK (single build)
        if: steps.mode.outputs.split == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: Clint-Universal
          path: app/build/outputs/apk/github/release/app-github-release.apk
          if-no-files-found: error

      - name: Upload Universal APK
        if: steps.mode.outputs.split == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Clint-Universal
          path: app/build/outputs/apk/github/release/app-github-universal-release.apk
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        if: steps.mode.outputs.split == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Clint-arm64-v8a
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        if: steps.mode.outputs.split == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Clint-armeabi-v7a
          path: app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk
          if-no-files-found: warn

      - name: Upload x86 APK
        if: steps.mode.outputs.split == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Clint-x86
          path: app/build/outputs/apk/github/release/app-github-x86-release.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        if: steps.mode.outputs.split == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Clint-x86_64
          path: app/build/outputs/apk/github/release/app-github-x86_64-release.apk
          if-no-files-found: warn

      - name: Publish built APK to public/
        run: |
          set -e
          VERSION=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          OUT_DIR="app/build/outputs/apk/github/release"
          APK_SRC=""
          APK_NAME=""
          if [ -f "$OUT_DIR/app-github-universal-release.apk" ]; then
            APK_SRC="$OUT_DIR/app-github-universal-release.apk"
            APK_NAME="ClintBrowser-${VERSION}-universal.apk"
          elif [ -f "$OUT_DIR/app-github-release.apk" ]; then
            APK_SRC="$OUT_DIR/app-github-release.apk"
            APK_NAME="ClintBrowser-${VERSION}.apk"
          else
            echo "::error::No release APK was found in $OUT_DIR"
            ls -lhR "$OUT_DIR" || true
            exit 1
          fi

          mkdir -p public
          cp "$APK_SRC" "public/$APK_NAME"
          SIZE=$(stat -c%s "public/$APK_NAME")
          echo "Published APK: public/$APK_NAME ($SIZE bytes)"
          ls -lh "public/$APK_NAME"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK is suspiciously small ($SIZE bytes) — build likely incomplete."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "public/$APK_NAME"
          if git diff --staged --quiet; then
            echo "No changes — APK already up to date."
          else
            git commit -m "ci: publish built APK ${VERSION} [skip ci]"
            git push
            echo "Pushed APK to public/$APK_NAME"
          fi
